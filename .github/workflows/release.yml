name: Release

# Pushing a tag like v0.0.2 (or creating a release with a new tag on GitHub) builds the Windows
# installer and attaches vinyl-setup.exe to that release, which is what installed copies of
# Vinyl look for when they check for updates. The version is taken from the tag (v0.0.2 -> 0.0.2),
# so there is nothing to bump in Cargo.toml first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach the installer to (e.g. v0.0.1)'
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set the version from the tag
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag $env:TAG is not a version like v1.2.3" }
          # Only this build's copy of Cargo.toml changes; the repository is left as it is.
          (Get-Content Cargo.toml -Raw) -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$version`"" | Set-Content Cargo.toml -NoNewline
          "Building Vinyl $version"
          Select-String -Path Cargo.toml -Pattern '^version' | Select-Object -First 1

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build vinyl-setup.exe
        shell: pwsh
        run: ./installer/build.ps1

      - name: Attach to the release
        shell: pwsh
        run: |
          # A release made in the web UI may still be saving when the tag push starts this job.
          $found = $false
          for ($i = 0; $i -lt 12 -and -not $found; $i++) {
            gh release view $env:TAG 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { $found = $true } else { Start-Sleep -Seconds 5 }
          }
          if ($found) {
            gh release upload $env:TAG dist/vinyl-setup.exe --clobber
          } else {
            gh release create $env:TAG dist/vinyl-setup.exe --title "Vinyl $($env:TAG.TrimStart('v'))" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not attach the installer to the release' }
